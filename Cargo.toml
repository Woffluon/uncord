[workspace]
resolver = "2"
members = [
  "crates/uncord-core",
  "crates/uncord-cli",
  "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Woffluon"]
repository = "https://github.com/Woffluon/uncord"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
